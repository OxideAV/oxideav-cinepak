name: Fuzz

# Daily fuzz run for the cargo-fuzz harnesses under fuzz/. The Cinepak
# decoder surface (FrameHeader::parse -> RawStripHeader::parse ->
# CinepakDecoder::decode_frame / decode_deviant_frame [Saturn +
# Lemmings 3DO configs]) plus the Sega FILM container demuxer
# (probe_film, FilmDemuxer::parse) is the part worth fuzzing; there is
# no external library oracle worth pulling in (and the clean-room wall
# bars any reference codec source anyway), so this is a decode-only
# panic-free harness: one target gets the whole 30-minute budget.

on:
  schedule:
    - cron: "53 6 * * *"   # daily 06:53 UTC, jittered off the hour
  workflow_dispatch:

jobs:
  fuzz:
    uses: OxideAV/.github/.github/workflows/crate-fuzz.yml@master
    with:
      time_budget_seconds: 1800
    secrets: inherit
