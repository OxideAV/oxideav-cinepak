[package]
name = "oxideav-cinepak"
version = "0.0.2"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-cinepak"
authors = ["Mark Karpeles"]
description = "Pure-Rust Cinepak (CVID) video decoder for the oxideav framework"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-cinepak"
keywords = ["multimedia", "video", "cinepak", "cvid", "codec"]
categories = ["multimedia::encoding", "multimedia::video"]

[dependencies]
# `oxideav-core` is gated behind the default-on `registry` feature so
# image-library consumers can depend on `oxideav-cinepak` with
# `default-features = false` and avoid the framework dependency tree
# entirely. Without `registry` the crate exposes a free-standing
# `CinepakDecoder` plus crate-local `CinepakFrame` / `CinepakPlane` /
# `CinepakPixelFormat` / `CinepakError` types and never references
# `oxideav-core`.
oxideav-core = { version = "0.1", optional = true }

[features]
default = ["registry"]

# Wires up the framework `Decoder` trait implementation, the
# `register_codecs` / `register` entry points, and the
# `From<CinepakError> for oxideav_core::Error` /
# `From<CinepakFrame> for oxideav_core::VideoFrame` conversions
# against `oxideav-core`. Default-on; turn off for image-library
# use-cases that just want the standalone `CinepakDecoder` API.
registry = ["dep:oxideav-core"]
